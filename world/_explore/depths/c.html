<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Size of the Pool (prototype C)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="forms.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:Heebo,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s;padding:0 16px}
.title h1{font:700 76px/1.1 Heebo;letter-spacing:-.01em}
.title p{font:500 28px/1.3 Heebo;margin-top:14px}
.title .go{margin-top:190px;font:500 26px Heebo;color:#666}
.hide{opacity:0;pointer-events:none}
.desc{position:fixed;left:0;right:0;bottom:64px;text-align:center;padding:0 16px;transition:opacity .35s}
.desc h2{font:700 34px/1.15 Heebo}
.desc .t{font:400 20px/1.4 Heebo;color:#bbb;margin-top:8px}
.desc .n{font:500 16px Heebo;letter-spacing:.12em;text-transform:uppercase;color:#ffe89a;margin-top:10px}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:26px;cursor:pointer}
.prev{left:max(14px,2vw)}.next{right:max(14px,2vw)}
.count{position:fixed;top:18px;right:20px;font:500 16px Heebo;color:#888}
@media (max-width:600px){.title h1{font-size:44px}.title p{font-size:20px}.title .go{font-size:18px;margin-top:120px}.desc{bottom:96px}.desc h2{font-size:24px}.desc .t{font-size:16px}.nav{top:auto;bottom:22px;transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="title" id="title"><h1>The Size of the Pool</h1><p>His honors, one lit point in each crowd</p><div class="go">Use the Right Arrow Key or Swipe Left to Start →</div></div>
<div class="desc hide" id="desc" aria-live="polite"><h2 id="dn"></h2><div class="t" id="dt"></div><div class="n" id="dd"></div></div>
<button class="nav prev" id="prev" aria-label="Previous">‹</button><button class="nav next" id="next" aria-label="Next">›</button>
<div class="count" id="count"></div>
<script>
(function () {
  var P = window.PIER, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W, H, DPR, step = 0, cam = 1, camFrom = 1, camTo = 1, t0 = 0, DUR = 1400, MAXN = 1628;
  var GA = Math.PI * (3 - Math.sqrt(5));
  function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
  size(); addEventListener('resize', size);
  function fitScale(n) { var R = Math.sqrt(n) * 10 + 14; return (Math.min(W, H) * 0.34) / R; }
  function fmt(n) { return n < 10 ? n.toFixed(1).replace(/\.0$/, '') : Math.round(n).toLocaleString('en-US'); }
  function go(s) {
    s = Math.max(0, Math.min(P.length, s)); if (s === step && t0) return;
    step = s; camFrom = cam; camTo = s ? fitScale(P[s - 1].n) : 3; t0 = performance.now();
    document.getElementById('title').classList.toggle('hide', s > 0);
    var d = document.getElementById('desc'); d.classList.toggle('hide', !s);
    document.getElementById('count').textContent = s ? s + ' / ' + P.length : '';
    if (s) { var it = P[s - 1]; document.getElementById('dn').textContent = it.name; document.getElementById('dt').textContent = it.fact; document.getElementById('dd').textContent = (it.approx ? '~' : '') + '1 in ' + fmt(it.n); }
  }
  addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); });
  document.getElementById('next').onclick = function () { go(step + 1); };
  document.getElementById('prev').onclick = function () { go(step - 1); };
  var sx = null; addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(step + (dx < 0 ? 1 : -1)); sx = null; });
  go(0); cam = camTo;
  function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function frame(now) {
    var u = Math.min(1, (now - t0) / DUR), e = ease(u);
    cam = Math.exp(Math.log(camFrom) + (Math.log(camTo) - Math.log(camFrom)) * e);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .8);
    g.addColorStop(0, '#06162a'); g.addColorStop(1, '#000'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var n = step ? P[step - 1].n : 1, shown = Math.round(Math.max(n, 1)), cx = W / 2, cy = H * .42;
    var total = Math.min(MAXN, Math.ceil(Math.max(n, step > 1 ? P[step - 2].n : 1)) + 2);
    for (var i = 1; i < total + 400 && i < MAXN + 10; i++) {
      var r = Math.sqrt(i) * 10 * cam, a = i * GA, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
      var alpha = i < shown ? .55 : Math.max(0, .12 - (i - shown) * .001);
      if (alpha <= 0) continue;
      ctx.fillStyle = 'rgba(160,200,230,' + alpha + ')';
      ctx.beginPath(); ctx.arc(x, y, Math.max(.8, 3.2 * Math.min(1.4, cam)), 0, 7); ctx.fill();
    }
    if (step) {
      var rr = Math.max(5, 5 * Math.min(2.2, cam));
      var gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr * 7); gl.addColorStop(0, 'rgba(255,236,150,.8)'); gl.addColorStop(1, 'rgba(255,236,150,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, rr * 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff4c0'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
