<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype A: the flat road, 2025 polish</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f3b86a;font-family:Nunito,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:fixed;left:16px;top:16px;font:800 16px Nunito;color:#fff;text-shadow:0 1px 3px #0006}
.panel{position:fixed;right:0;top:16px;display:flex;flex-direction:column;gap:8px}
.panel button{height:44px;padding:0 16px;border:0;border-radius:10px 0 0 10px;color:#fff;font:800 15px Nunito;background:radial-gradient(#c21515,#46123b);box-shadow:inset 3px 0 0 -2px #ffffff59}
.start{position:fixed;left:50%;top:60%;transform:translate(-50%,-50%);font:700 64px 'Amatic SC',cursive;color:#fff;text-shadow:0 2px 8px #0004;transition:opacity .4s;pointer-events:none}
html.started .start{opacity:0}
.hud{position:fixed;left:50%;bottom:26px;transform:translate(-50%,160%);transition:transform .5s cubic-bezier(.4,1.6,.65,1);background:radial-gradient(#251f2b,#1d1721);color:#fff;border-radius:14px;padding:14px 18px;max-width:calc(100vw - 32px);width:420px;box-shadow:inset 0 0 0 3px #1d1721,inset 0 0 0 4px #ffffff59}
.hud.show{transform:translate(-50%,0)}
.hud b{display:block;font:700 34px/1 'Amatic SC'}
.hud span{font:600 15px Nunito;opacity:.9}
.joy{position:fixed;left:16px;bottom:16px;width:150px;height:150px;border:2px solid #fff;border-radius:50%;opacity:.5;display:none;touch-action:none}
.joy i{position:absolute;left:45px;top:45px;width:60px;height:60px;border:2px solid #fff;border-radius:50%}
html.coarse.started .joy{display:block}
</style>
</head>
