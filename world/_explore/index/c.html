<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype C: one slow road</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;400&family=Overpass+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8a5a42;font-family:Lexend,Arial,sans-serif;color:#f4efe6}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(40,30,28,.25);transition:opacity .8s}
.title h1{margin:0;font:200 clamp(40px,7vw,96px)/1 Lexend;letter-spacing:.32em;text-shadow:0 0 18px rgba(255,240,220,.7);text-align:center;padding-left:.32em}
.title p{margin:0;font:400 20px Lexend;opacity:.9}
.title button{font:400 17px 'Overpass Mono',monospace;background:#f4efe6;color:#222;border:0;border-radius:40px;padding:16px 70px;cursor:pointer}
html.started .title{opacity:0;pointer-events:none}
.tag{position:fixed;left:16px;top:16px;font:400 13px 'Overpass Mono';opacity:.8}
.sign{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);transition:transform .6s cubic-bezier(.4,1.5,.6,1);background:#0f6b45;border-radius:10px;padding:12px 18px;box-shadow:inset 0 0 0 3px #0f6b45,inset 0 0 0 5px #fff;min-width:300px;max-width:calc(100vw - 32px);text-align:left}
.sign.show{transform:translate(-50%,0)}
.sign b{display:block;font:400 26px Lexend}
.sign span{font:400 15px Lexend;opacity:.92}
.sign small{display:block;margin-top:6px;font:400 12px 'Overpass Mono';letter-spacing:.08em;text-transform:uppercase}
.odo{position:fixed;right:16px;bottom:16px;font:400 13px 'Overpass Mono';text-align:right;opacity:.85}
.pedal{position:fixed;right:16px;bottom:48px;width:90px;height:120px;border:2px solid #fff8;border-radius:14px;display:none;align-items:center;justify-content:center;font:400 13px 'Overpass Mono'}
.steer{position:fixed;left:16px;bottom:16px;display:none;gap:10px}
.steer button{width:70px;height:70px;border-radius:50%;border:2px solid #fff8;background:none;color:#fff;font:400 22px Lexend}
html.coarse.started .pedal{display:flex}html.coarse.started .steer{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>husam sokar</h1><p>fresno &rarr; cambridge</p><button id="go" type="button">begin</button></div>
<div class="tag">Prototype C &middot; one slow road</div>
<div class="sign" id="sign"><b id="sn"></b><span id="st"></span><small>Exit: press Enter</small></div>
<div class="odo" id="odo"></div>
<div class="pedal" id="pedal">hold</div>
<div class="steer"><button id="sl" type="button">&larr;</button><button id="sr" type="button">&rarr;</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
var D = [
 {id:'bill', name:'The Capitol', t:'Ever watched an idea learn to walk?'},
 {id:'speech', name:'The Chamber', t:'You have the floor. Better use it.'},
 {id:'translation', name:'The Bridge', t:'Every word has another side.'},
 {id:'n1', name:'The Polling Station', t:'Everyone has an opinion. Someone has to count.'},
 {id:'triptik', name:'The Map Room', t:'Every road remembers where it started.'},
 {id:'os', name:'The Garage', t:'Mind the cables. Something is booting.'},
 {id:'depths', name:'The Pier', t:'How deep does it go? Hold your breath.'},
 {id:'weeks', name:'The Plaza', t:'Where does the time go? Here, mostly.'},
 {id:'everywhere', name:'The Airport', t:'Now boarding: somewhere far.'},
 {id:'mail', name:'The Mailbox', t:'Say hello. It delivers.'}
];
var html = document.documentElement, V3 = THREE.Vector3;
if (matchMedia('(pointer: coarse)').matches) html.classList.add('coarse');
var renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: !html.classList.contains('coarse')});
renderer.setPixelRatio(Math.min(devicePixelRatio, html.classList.contains('coarse') ? 1.5 : 2));
var scene = new THREE.Scene(), LEN = 1300;
var camera = new THREE.PerspectiveCamera(55, 1, .3, 700);
// the road: gentle bends and grades, flat ground either side, hills beyond
function rx(z) { return Math.sin(z*.0045)*34 + Math.sin(z*.013)*10; }
function ry(z) { return Math.sin(z*.006)*5 + Math.sin(z*.017)*1.5; }
function hash(x, z) { var s = Math.sin(x*127.1 + z*311.7)*43758.5453; return s - Math.floor(s); }
function noise(x, z) { var ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz; fx = fx*fx*(3-2*fx); fz = fz*fz*(3-2*fz); var a = hash(ix,iz), b = hash(ix+1,iz), c = hash(ix,iz+1), d = hash(ix+1,iz+1); return a + (b-a)*fx + (c-a)*fz + (a-b-c+d)*fx*fz; }
function height(x, z) { var dx = Math.abs(x - rx(z)), k = Math.min(1, Math.max(0, (dx - 7)/40)); k = k*k*(3-2*k); return ry(z) - .15 + k*(noise(x*.02, z*.02)*26 + noise(x*.07, z*.07)*5); }
// sky: dusk gradient (Slow Roads' title), sun low over the road
var skyU = {top: {value: new THREE.Color('#6d5a6e')}, mid: {value: new THREE.Color('#d98a5c')}, low: {value: new THREE.Color('#f2b27a')}};
var hr = new Date().getHours(); if (hr < 6 || hr > 20) { skyU.top.value.set('#0f1830'); skyU.mid.value.set('#2d3558'); skyU.low.value.set('#4b4a6e'); } else if (hr > 8 && hr < 17) { skyU.top.value.set('#5d9ad0'); skyU.mid.value.set('#a9cde4'); skyU.low.value.set('#e8e2cf'); }
var sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({side: THREE.BackSide, depthWrite: false, uniforms: skyU, vertexShader: 'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }', fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h=vP.y; vec3 c=h>0.08?mix(mid,top,smoothstep(.08,.6,h)):mix(low,mid,smoothstep(-.05,.08,h)); gl_FragColor=vec4(c,1.); }'}));
scene.add(sky); scene.fog = new THREE.Fog(skyU.low.value.clone().lerp(skyU.mid.value, .4), 30, 260);
scene.add(new THREE.HemisphereLight(skyU.mid.value, '#3b3a33', .9)); var sun = new THREE.DirectionalLight(skyU.low.value, .9); sun.position.set(-40, 30, 100); scene.add(sun);
// terrain as one long strip, vertex coloured: grass, dry gold on the slopes
(function () { var W = 180, SX = 60, SZ = 520, g = new THREE.PlaneGeometry(W, LEN + 200, SX, SZ).rotateX(-Math.PI/2), p = g.attributes.position, col = []; for (var i = 0; i < p.count; i++) { var z = p.getZ(i) + LEN/2 - 100, x = p.getX(i) + rx(z); p.setX(i, x); p.setZ(i, z); var h = height(x, z); p.setY(i, h); var c = new THREE.Color('#6f8a4c').lerp(new THREE.Color('#c9a25a'), Math.min(1, Math.max(0, (h - ry(z))/14))); c.lerp(new THREE.Color('#566b3e'), hash(x, z)*.25); col.push(c.r, c.g, c.b); } g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals(); scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors: true}))); })();
(function () { var pos = [], lines = [], N = 1300; for (var i = 0; i < N; i++) { var z0 = i*LEN/N - 30, z1 = (i+1)*LEN/N - 30; [[-3.6, 3.6, pos, 1], [-.12, .12, lines, i % 8 < 4], [3.3, 3.45, lines, 1], [-3.45, -3.3, lines, 1]].forEach(function (s) { if (!s[3]) return; var a0 = new V3(rx(z0) + s[0], ry(z0) + .05, z0), a1 = new V3(rx(z0) + s[1], ry(z0) + .05, z0), b0 = new V3(rx(z1) + s[0], ry(z1) + .05, z1), b1 = new V3(rx(z1) + s[1], ry(z1) + .05, z1); if (s[2] === lines) [a0, a1, b0, b1].forEach(function (v) { v.y += .02; }); s[2].push(a0, b0, a1, a1, b0, b1); }); } var g = new THREE.BufferGeometry().setFromPoints(pos); g.computeVertexNormals(); scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: '#3c3b3f', side: THREE.DoubleSide}))); var g2 = new THREE.BufferGeometry().setFromPoints(lines); scene.add(new THREE.Mesh(g2, new THREE.MeshBasicMaterial({color: '#e8e0c8', side: THREE.DoubleSide}))); })();
function M(c) { return new THREE.MeshLambertMaterial({color: c}); }
var PAL = ['#9fcf7a','#7fb766','#4a4c57','#f4efe0','#f2ead3','#d9654f','#a87a52','#a9b3b8','#5f8a4a','#4a7040','#5aa7c2','#e8b84a','#4f7fb0','#c9483c','#2b3140','#fff3c2'].map(M);
var BOX = new THREE.BoxGeometry(1,1,1).translate(0,.5,0), CYL = new THREE.CylinderGeometry(.5,.5,1,14).translate(0,.5,0), SPH = new THREE.IcosahedronGeometry(.5,1).translate(0,.5,0), DOME = new THREE.SphereGeometry(.5,16,8,0,Math.PI*2,0,Math.PI/2);
function add(G, geo, p, x, y, z, sx, sy, sz, ry_) { var m = new THREE.Mesh(geo, PAL[p]); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.rotation.y = ry_ || 0; G.add(m); return m; }
var BUILD = {
 bill: function (F) { add(F,BOX,4,0,0,0,7,1.2,5); for (var i=-2;i<=2;i++) add(F,CYL,3,i*1.3,1.2,1.8,.5,2.6,.5); add(F,BOX,4,0,3.8,0,6.4,.6,4.4); add(F,CYL,4,0,4.4,0,3.2,1.2,3.2); add(F,DOME,11,0,5.6,0,3.4,3.4,3.4); },
 speech: function (F) { add(F,BOX,6,0,0,0,2.2,3.2,1.6,.2); add(F,BOX,6,0,3.1,-.2,2.8,.3,2.1,.2); add(F,CYL,6,2.6,0,1.2,.9,1.6,.9); },
 translation: function (F) { add(F,BOX,7,-5,0,0,1,4,3); add(F,BOX,7,5,0,0,1,4,3); add(F,BOX,7,0,4,0,11,.6,3); add(F,BOX,12,0,5.4,1.6,6,1.8,.3); },
 n1: function (F) { add(F,BOX,4,0,0,0,5,3,4); add(F,BOX,5,0,3,0,5.6,.6,4.6); for (var i=0;i<5;i++) add(F,BOX,i%2?11:13,-3.8,0,-1.5+i*.8,.6,1+i*.7,.6); },
 triptik: function (F) { add(F,BOX,4,0,0,0,4,2.6,3); add(F,BOX,5,0,2.6,0,5,.4,3.8); add(F,BOX,13,3.4,0,0,.8,2.6,.8); add(F,SPH,11,3.4,2.6,0,1,1,1); },
 os: function (F) { add(F,BOX,7,0,0,0,6,3.6,5); add(F,BOX,6,0,3.6,0,6.6,.5,5.6); add(F,BOX,14,0,.1,2.52,4,2.8,.1); },
 depths: function (F) { add(F,CYL,10,0,-.9,0,12,1,12); add(F,BOX,6,0,1.2,0,3,.3,9); },
 weeks: function (F) { for (var x=-3;x<=3;x++) for (var z=-3;z<=3;z++) add(F,BOX,(x+z)%2?4:3,x*1.1,0,z*1.1,1,.18,1); },
 everywhere: function (F) { add(F,BOX,4,0,0,0,8,2.4,4); add(F,CYL,7,4.8,0,-1,1.2,6.5,1.2); add(F,SPH,12,-3,2.4,-.5,3,3,3); },
 mail: function (F) { add(F,CYL,6,0,0,0,.25,1.4,.25); add(F,BOX,12,0,1.4,0,.9,.8,1.4); }
};
D.forEach(function (d, i) { d.z = 110 + i*112; var side = i % 2 ? 1 : -1, G = new THREE.Group(); G.position.set(rx(d.z) + side*(d.id === 'mail' ? 5 : 13), ry(d.z), d.z); G.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2; scene.add(G); BUILD[d.id](G);
  // an overhead green exit sign a little before each stop
  var s = new THREE.Group(), zs = d.z - 34; s.position.set(rx(zs), ry(zs), zs); add(s, CYL, 7, -4.4, 0, 0, .25, 6.2, .25); add(s, CYL, 7, 4.4, 0, 0, .25, 6.2, .25); add(s, BOX, 7, 0, 6, 0, 9.2, .2, .2); var c = document.createElement('canvas'); c.width = 512; c.height = 160; var x = c.getContext('2d'); x.fillStyle = '#0f6b45'; x.fillRect(0,0,512,160); x.strokeStyle = '#fff'; x.lineWidth = 6; x.strokeRect(8,8,496,144); x.fillStyle = '#fff'; x.font = '400 54px Lexend, Arial'; x.textAlign = 'center'; x.fillText(d.name.replace('The ',''), 256, 78); x.font = '400 28px Lexend, Arial'; x.fillText((side > 0 ? 'exit right →' : '← exit left'), 256, 124); var m = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(c), side: THREE.DoubleSide})); m.position.set(0, 6.9, 0); m.rotation.y = Math.PI; s.add(m); scene.add(s); });
// roadside life: fence posts, oaks, poles
(function () { var inst = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.4, 1), M('#4f6b3a'), 400), trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(.18,.24,2.2,6), M('#6b5037'), 400), m = new THREE.Matrix4(), k = 0; for (var i = 0; i < 400; i++) { var z = hash(i, 1)*LEN, side = hash(i, 2) < .5 ? -1 : 1, x = rx(z) + side*(9 + hash(i,3)*50); if (D.some(function (d) { return Math.abs(d.z - z) < 14 && Math.abs(x - rx(z)) < 22; })) continue; var y = height(x, z), s = .8 + hash(i,4)*1.2; m.makeScale(s*1.3, s, s*1.3).setPosition(x, y + 2.2*s + 1, z); inst.setMatrixAt(k, m); m.makeScale(s, s, s).setPosition(x, y + 1.1*s, z); trunks.setMatrixAt(k++, m); } inst.count = trunks.count = k; scene.add(inst, trunks); })();
// the car and the chase camera
var car = new THREE.Group(); add(car,BOX,13,0,.35,0,1.4,.6,2.6); add(car,BOX,13,0,.95,.25,1.25,.5,1.3); add(car,BOX,14,0,.98,1.0,1.1,.36,.05); add(car,BOX,5,-.5,.55,1.31,.3,.14,.03); add(car,BOX,5,.5,.55,1.31,.3,.14,.03); scene.add(car);
var st = {s: 0, lat: 1.7, v: 0, cruise: false}, keys = {}, started = false, near = null, touch = {gas: false, l: false, r: false};
function start() { started = true; html.classList.add('started'); st.cruise = true; }
document.getElementById('go').addEventListener('click', start);
addEventListener('keydown', function (e) { keys[e.code] = true; if (e.code === 'Enter') { if (!started) start(); else if (near && near.id !== 'mail') location.href = '../../' + near.id + '.html'; } });
addEventListener('keyup', function (e) { keys[e.code] = false; });
function hold(id, k) { var el = document.getElementById(id); el.addEventListener('touchstart', function (e) { e.preventDefault(); touch[k] = true; }, {passive: false}); el.addEventListener('touchend', function () { touch[k] = false; }); }
hold('pedal', 'gas'); hold('sl', 'l'); hold('sr', 'r');
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.fov = camera.aspect < 1 ? 70 : 55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
var sign = document.getElementById('sign'), odo = document.getElementById('odo'), camPos = new V3(0, 4, -8), last = performance.now();
function frame(t) {
  var dt = Math.min(.05, (t - last)/1000); last = t;
  if (started) { var gas = keys.KeyW || keys.ArrowUp || touch.gas, brk = keys.KeyS || keys.ArrowDown; if (gas || brk) st.cruise = false; var target = gas ? (keys.ShiftLeft ? 34 : 22) : st.cruise ? 12 : 0; if (brk) target = -4; st.v += (target - st.v)*Math.min(1, dt*(brk ? 2 : .7)); var steer = ((keys.KeyD||keys.ArrowRight||touch.r)?1:0) - ((keys.KeyA||keys.ArrowLeft||touch.l)?1:0); st.lat = Math.max(-3, Math.min(3, st.lat + steer*dt*4.5)); st.s += st.v*dt; if (st.s > LEN - 40) st.s = 0; if (st.s < 0) st.s = 0; }
  else st.s = (t*.004) % 200;
  var z = st.s, dx = rx(z + 1) - rx(z - 1), yaw = Math.atan2(dx, 2), p = new V3(rx(z) + st.lat*Math.cos(yaw), ry(z), z - st.lat*Math.sin(yaw));
  car.position.copy(p); car.rotation.set(-Math.atan2(ry(z+1) - ry(z-1), 2), yaw, 0);
  var back = new V3(Math.sin(yaw), 0, Math.cos(yaw)), cp = p.clone().sub(back.clone().multiplyScalar(started ? 8 + st.v*.08 : 14)).add(new V3(0, started ? 3.2 : 6, 0)); camPos.lerp(cp, Math.min(1, dt*4)); camera.position.copy(camPos); camera.lookAt(p.clone().add(back.multiplyScalar(10)).add(new V3(0, 1.2, 0)));
  sky.position.copy(camera.position); sun.position.copy(camera.position).add(new V3(-40, 30, 100));
  var n2 = null; D.forEach(function (d) { if (d.z - st.s < 30 && d.z - st.s > -6) n2 = d; }); if (!started) n2 = null; if (n2 !== near) { near = n2; if (near) { document.getElementById('sn').textContent = near.name; document.getElementById('st').textContent = near.t; } sign.classList.toggle('show', !!near); }
  odo.textContent = started ? Math.round(st.v*3.6) + ' km/h  ·  ' + Math.round(st.s/LEN*100) + '% of the way' : '';
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
