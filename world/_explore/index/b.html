<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype B: a tiny planet</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sea:#65c1bc;--ink:#23262e;--cream:#f2efe2;--yellow:#f0d055}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);font-family:Barlow,Arial,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.5,0,.2,1)}
.title h1{margin:0;font:400 clamp(64px,13vw,170px)/.86 Bungee,Impact,sans-serif;color:var(--cream);text-align:center;letter-spacing:.02em;
  text-shadow:0 1px 0 #cfc9b4,0 2px 0 #cfc9b4,0 3px 0 #cfc9b4,0 4px 0 #b9b39c,0 5px 0 #b9b39c,0 6px 0 #a39d86,0 7px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.title p{margin:0;font:700 18px Barlow;letter-spacing:.2em;text-transform:uppercase;color:#1d4f4c}
.go{pointer-events:auto;font:400 22px Bungee,Impact,sans-serif;background:var(--yellow);color:#fff;text-shadow:0 2px 0 #b38f1c;border:0;padding:14px 30px 12px;box-shadow:0 6px 0 #c9a22a,0 6px 0 2px var(--ink),0 0 0 2px var(--ink);cursor:pointer;transform:rotate(-1deg)}
.go:hover{transform:rotate(-1deg) translateY(-2px)}
html.started .title{opacity:0;transform:scale(1.15)}
.hud{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);transition:transform .5s cubic-bezier(.4,1.6,.65,1);background:var(--cream);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:12px 16px;max-width:calc(100vw - 32px);width:440px}
.hud.show{transform:translate(-50%,0)}
.hud b{display:block;font:400 22px Bungee}
.hud span{font:500 16px Barlow}
.hud small{display:block;margin-top:6px;font:700 13px Barlow;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tag{position:fixed;left:16px;top:16px;font:400 18px Bungee;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.joy{position:fixed;left:16px;bottom:16px;width:140px;height:140px;border:2px solid #fff;border-radius:50%;opacity:.5;display:none;touch-action:none}
.joy i{position:absolute;left:45px;top:45px;width:50px;height:50px;border:2px solid #fff;border-radius:50%}
html.coarse.started .joy{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Husam<br>Sokar</h1><p>Fresno &rarr; Cambridge, all the way around</p><button class="go" id="go">Start the car</button></div>
<div class="tag">Prototype B &middot; tiny planet</div>
<div class="hud" id="hud"><b id="hn"></b><span id="ht"></span><small>Enter to go in</small></div>
<div class="joy" id="joy"><i id="knob"></i></div>

<script>

  vertexShader: 'attribute float pal; varying float vPal; varying vec3 vN; void main(){ vPal=pal; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',

  fragmentShader: 'void main(){ gl_FragColor=vec4(.14,.15,.19,1.); }' });

};
D.forEach(function (d, i) {
  var t = .08 + i * .092, s = site(t, i % 2 ? 1 : -1, d.id === 'depths' ? 9.5 : 7.5);
  d.site = s; var F = frameAt(s.n, s.f.clone().multiplyScalar(i % 2 ? -1 : 1).cross(s.n)); BUILD[d.id](F);
  statics.push({n: s.n, r: d.id === 'weeks' || d.id === 'depths' ? 0 : d.id === 'mail' ? 1 : 3.4});

});
// trees and houses scattered away from the road

var world = new THREE.Mesh(THREE.BufferGeometryUtils ? THREE.BufferGeometryUtils.mergeBufferGeometries(parts) : merge(parts), toon);

D.forEach(function (d) { var tt = tagTex(d.name.replace('The ','').toUpperCase()); var m = new THREE.Mesh(new THREE.PlaneGeometry(tt.a*1.1, 1.1).translate(tt.a*.55 - .55, 0, 0), new THREE.MeshBasicMaterial({map: tt.t, transparent: true, depthTest: false})); m.renderOrder = 5; m.position.copy(d.site.n.clone().multiplyScalar(R + (d.id === 'mail' ? 4 : 10))); scene.add(m); d.tag = m; });

// ---------- physics: radial gravity; the name letters are bricks you knock over ----------
var pw = new CANNON.World(); pw.gravity.set(0,0,0); pw.allowSleep = true; pw.defaultContactMaterial.friction = .3; pw.defaultContactMaterial.restitution = .2;
var planetBody = new CANNON.Body({mass: 0, shape: new CANNON.Sphere(R)}); pw.addBody(planetBody);
var carBody = new CANNON.Body({mass: 0, type: CANNON.Body.KINEMATIC, shape: new CANNON.Box(new CANNON.Vec3(1, .55, .6))}); pw.addBody(carBody);
var GLYPH = {H:['1...1','1...1','11111','1...1','1...1'],U:['1...1','1...1','1...1','1...1','.111.'],S:['.1111','1....','.111.','....1','1111.'],A:['.111.','1...1','11111','1...1','1...1'],M:['1...1','11.11','1.1.1','1...1','1...1'],O:['.111.','1...1','1...1','1...1','.111.'],K:['1..1.','1.1..','11...','1.1..','1..1.'],R:['1111.','1...1','1111.','1.1..','1..11']};
var dyn = [];
function letter(ch, n, f, off) { var g = []; GLYPH[ch].forEach(function (row, y) { for (var x = 0; x < 5; x++) if (row[x] === '1') { var b = withPal(BOX.clone(), 3); b.applyMatrix4(new THREE.Matrix4().makeTranslation((x-2)*.36, (4-y)*.36-.2, 0).multiply(new THREE.Matrix4().makeScale(.36,.36,.5))); smoothOutlineNormals(b); g.push(b); } }); var geo = merge(g); geo.translate(0, -.72, 0); var mesh = new THREE.Mesh(geo, toon), ol = new THREE.Mesh(geo, outlineMat); mesh.add(ol); scene.add(mesh);
  var F = frameAt(n, f), p = new V3(), q = new THREE.Quaternion(), s = new V3(); F.decompose(p, q, s); var up = n.clone(); p.add(up.multiplyScalar(1.2 + off));
