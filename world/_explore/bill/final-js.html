function pt(e){var r=pad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
pad.addEventListener('pointerdown',function(e){e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(_){ }curS=[pt(e)];strokes.push(curS);$('sign').classList.add('drawing');sheet.classList.add('inking');});
pad.addEventListener('pointermove',function(e){if(!curS)return;var p=pt(e),l=curS[curS.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)<1.5)return;inked+=Math.hypot(p.x-l.x,p.y-l.y);curS.push(p);ctx.strokeStyle='#1c2f6e';ctx.lineCap='round';var n=curS.length;seg(curS[Math.max(0,n-3)],curS[n-2],curS[n-1]);});
function up(){if(!curS)return;curS=null;if(inked>90)doSign();}
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
function doSign(){
  if(signed)return;signed=true;
  sheet.classList.add('signed');
  $('after').textContent='Signed. Enrolled, stamped, and into the record.';
  var sb=doc.querySelector('#tracker .sig');sb.classList.add('done');sb.querySelector('span').textContent='Signed';
  $('toon').classList.add('signed-toon');
  if(cur===7) show(7);
}
function unSign(){
  signed=false;sheet.classList.remove('signed');$('after').textContent='';
  var sb=doc.querySelector('#tracker .sig');sb.classList.remove('done');sb.querySelector('span').textContent='Your signature';
  $('toon').classList.remove('signed-toon');if(cur===7) show(7);
}
$('clear').onclick=function(){strokes=[];inked=0;redraw();unSign();};
$('autosign').onclick=function(){
  strokes=[];inked=0;redraw();
  var w=pad.clientWidth,h=pad.clientHeight,pts=[],N=150,TT=Math.PI*2*6.3,sx=w*.66/TT,sy=h*.2;
  for(var i=0;i<=N;i++){var t=i/N*TT,amp=1-.35*(i/N);pts.push({x:w*.1+(t-1.5*Math.sin(t))*sx,y:h*.56-Math.cos(t)*sy*amp*(i<N*.18?1.5:1)+i/N*h*.05});}
  var tail=[];for(var k=0;k<=24;k++){var u=k/24;tail.push({x:w*.08+u*w*.8,y:h*.84-Math.sin(u*Math.PI)*h*.08-u*h*.05});}
  var s=[];strokes.push(s);
  if(RM){pts.forEach(function(p){s.push(p);});strokes.push(tail);redraw();doSign();return;}
  var all=pts.concat([null],tail),i=0;(function step(){for(var k=0;k<5&&i<all.length;k++,i++){if(all[i]===null){s=[];strokes.push(s);continue;}s.push(all[i]);var n=s.length;if(n>1){ctx.strokeStyle='#1c2f6e';ctx.lineCap='round';seg(s[Math.max(0,n-3)],s[n-2],s[n-1]);}}
    if(i<all.length)requestAnimationFrame(step);else doSign();})();
};
sizePad();
})();
</script>
